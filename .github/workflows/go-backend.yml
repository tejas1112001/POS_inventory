name: go-backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/go-backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/go-backend.yml"]

permissions:
  contents: read

concurrency:
  group: go-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: constsql
        run: make constsql
      - name: golangci-lint (gosec, staticcheck, errcheck, revive, ...)
        run: make lint
      - name: govulncheck
        run: make vuln
      - name: unit tests (race, goleak)
        run: make test-race
      - name: integration tests (testcontainers, Postgres 18)
        run: make test-integration
      - name: build image
        run: make docker

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Full history: the P0-1 history rewrite (2026-10-27) removed the
      # leaked backend/.env, so every commit must stay clean.
      - name: gitleaks (full history)
        run: make gitleaks-history
