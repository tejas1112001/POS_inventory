version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    # Minor and patch updates together; each major update in its own PR.
    groups:
      go-modules: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: docker
    directories: ["/backend"]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directories: ["/backend/deploy"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: ["/", "/frontend"]
    schedule: { interval: weekly }
    # Minor and patch updates together; each major update (ESLint, React
    # plugins, TanStack Table, ...) in its own PR, to be tested on its own.
    groups:
      npm: { patterns: ["*"], update-types: ["minor", "patch"] }
