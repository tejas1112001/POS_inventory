# BilMitra's own PostgreSQL 18 cluster (18/bilmitra), separate from the
# shared "main" cluster used by the other sites on this VPS.
# Installed as /etc/postgresql/18/bilmitra/conf.d/bilmitra.conf.
# Sized for a 4 GB VPS shared with other apps; raise shared_buffers,
# effective_cache_size and max_connections when the server grows.

listen_addresses = '127.0.0.1'          # never reachable from outside
port = 5433

max_connections = 60                    # posd pools: app 10 + jobs + listener + posctl
max_locks_per_transaction = 1024        # TENANCY §1.1 (one schema per shop)
shared_preload_libraries = 'pg_stat_statements'

shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 4MB
random_page_cost = 1.1                  # SSD

password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/postgresql/18/bilmitra/tls/server.crt'
ssl_key_file = '/etc/postgresql/18/bilmitra/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'

log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d '
timezone = 'UTC'
