# The old domain bilmitra.com, kept only as a redirect to mintobill.com
# (renamed 2026-11-23). Installed as /etc/nginx/sites-available/bilmitra.com
# by migrate-to-mintobill.sh, replacing the old app site. Every address
# keeps its path: <shop>.bilmitra.com/x -> <shop>.mintobill.com/x.
#
# Works while bilmitra.com still points here and its certificate renews.
# To drop the old domain: rm /etc/nginx/sites-enabled/bilmitra.com
# /etc/nginx/sites-available/bilmitra.com, nginx -t, reload, then
# certbot delete --cert-name bilmitra.com.

map $host $mintobill_from_old {
    default                                    mintobill.com;
    www.bilmitra.com                           mintobill.com;
    ~^(?<mb_old_sub>[a-z0-9-]+)\.bilmitra\.com$  $mb_old_sub.mintobill.com;
}

server {
    listen 80;
    server_name bilmitra.com *.bilmitra.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mintobill/acme;   # renewals of the old certificate
        default_type text/plain;
    }
    location / {
        return 301 https://$mintobill_from_old$request_uri;
    }
}

server {
    listen 443 ssl;   # no "http2": in nginx 1.18 it would switch every site on :443
    server_name bilmitra.com *.bilmitra.com;

    ssl_certificate /etc/letsencrypt/live/bilmitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilmitra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    return 301 https://$mintobill_from_old$request_uri;
}
