# BilMitra on bilmitra.com: Nginx site for the shared VPS.
# Installed as /etc/nginx/sites-available/bilmitra.com (+ symlink in
# sites-enabled). Only bilmitra.com names are matched, so no other site
# changes. Source of truth: backend/deploy/vps/nginx-bilmitra.com.conf.
#
# Hosts (TENANCY §7.1): bilmitra.com = landing, admin.bilmitra.com = Super
# Admin console, <shop>.bilmitra.com = each shop. posd routes by Host.
# The certificate lists each name (certbot, HTTP-01). Once DNS moves to a
# provider with a certbot DNS plugin, one *.bilmitra.com certificate
# replaces the per-name list and new shops need no step at all.

upstream bilmitra_posd {
    server 127.0.0.1:8090;
    keepalive 16;
}

# Port 80: ACME challenges, everything else to HTTPS.
server {
    listen 80;
    server_name bilmitra.com www.bilmitra.com *.bilmitra.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bilmitra/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# www → apex.
server {
    listen 443 ssl;   # no "http2": in nginx 1.18 it would switch every site on :443
    server_name www.bilmitra.com;

    ssl_certificate /etc/letsencrypt/live/bilmitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilmitra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;   # SEO OFF, see below
    return 301 https://bilmitra.com$request_uri;
}

# The app: landing, console and every shop.
server {
    listen 443 ssl;   # no "http2": in nginx 1.18 it would switch every site on :443
    server_name bilmitra.com *.bilmitra.com;

    ssl_certificate /etc/letsencrypt/live/bilmitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilmitra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bilmitra.access.log;
    error_log  /var/log/nginx/bilmitra.error.log;

    client_max_body_size 10m;           # same limit as the dev Caddyfile

    # SEO OFF (owner, 2026-11-22): no crawling or indexing until the site
    # content is final. To turn SEO on: delete this add_header line and the
    # "location = /robots.txt" block below, then nginx -t and reload; posd
    # then serves its own robots.txt (Allow + sitemap) again.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Security headers (CSP, frame, nosniff, HSTS when enabled) come from
    # posd so every host gets the policy OPERATIONS §7 defines.

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bilmitra/acme;
        default_type text/plain;
    }

    # /metrics is never proxied (it lives on 127.0.0.1:9095 only).
    location / {
        proxy_pass http://bilmitra_posd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;         # reports may take up to 60 s
        proxy_send_timeout 75s;
    }

    # While posd is down (deploy, restart, not configured yet).
    error_page 502 503 504 /__bilmitra_unavailable.html;
    location = /__bilmitra_unavailable.html {
        root /var/www/bilmitra/maintenance;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        add_header X-Robots-Tag "noindex, nofollow" always;   # SEO OFF
    }
}
